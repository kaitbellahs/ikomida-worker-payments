apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payments
  name: payments-worker
  namespace: ikomida-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - image: us-central1-docker.pkg.dev/ikomida-dev/docker/payments-worker-image:latest
          name: payments-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "18m"
              memory: "60Mi"
            limits:
              cpu: "150m"
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: NODE_ENV
                  optional: false
            - name: IKOMIDA_PRIVATEKEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: IKOMIDA_PRIVATEKEY
                  optional: false
            - name: IKOMIDA_PUBLICKEY
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: IKOMIDA_PUBLICKEY
                  optional: false
            - name: GOOGLEADMIN
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: googleAdmin
                  optional: false
            - name: MQUSER
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: MQUSER
            - name: MQPASS
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: MQPASS
            - name: MQVHOST
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: MQVHOST
            - name: DBUSER
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBUSER
            - name: DBPASS
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBPASS
            - name: DBNAME
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBNAME
            - name: DBHOST
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBHOST
            - name: DBPORT
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: DBPORT
            - name: PROJID
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PROJID
            - name: PAGSEGURO_EMAIL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_EMAIL
                  optional: false
            - name: PAGSEGURO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_TOKEN
                  optional: false
            - name: PAGSEGURO_APP
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: PAGSEGURO_APP
                  optional: false
