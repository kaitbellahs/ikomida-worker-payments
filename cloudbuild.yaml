steps:
  - id: dockerCache
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      [
        "-c",
        "docker pull us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:latest || exit 0",
      ]
  - id: dockerBuild
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      [
        "-c",
        'docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:$TAG_NAME -t us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:latest . --build-arg GOOGLE_SERVICE_ACCOUNT="$(echo $$GOOGLE_SERVICE_ACCOUNT)" --build-arg PROJECT_ID=$(echo $PROJECT_ID) --cache-from us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:latest',
      ]
    secretEnv: ["GOOGLE_SERVICE_ACCOUNT"]
    waitFor:
      - dockerCache
  - id: k8s
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/docker/k8s"
    entrypoint: "bash"
    args:
      [
        "-c",
        "(/builder/kubectl.bash -n ikomida-worker delete deploy payments-worker || true)  && for FILE in k8s/*.yaml; do printf \"$(cat $$FILE)\n---\n\" | envsubst; done | /builder/kubectl.bash apply -f -",
      ]
    env:
      - "CLOUDSDK_COMPUTE_ZONE=us-central1-b"
      - "CLOUDSDK_CONTAINER_CLUSTER=ikomida-dev-cluster"
images:
  [
    "us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:$TAG_NAME",
    "us-central1-docker.pkg.dev/$PROJECT_ID/docker/payments-worker-image:latest",
  ]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_NUMBER/secrets/google-service-account/versions/1
      env: "GOOGLE_SERVICE_ACCOUNT"
